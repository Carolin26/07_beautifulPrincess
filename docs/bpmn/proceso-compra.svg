<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="620" fill="#ffffff"/>

  <!-- Título -->
  <text x="700" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Proceso de negocio: Compra en línea de joyería</text>

  <!-- Carriles (pool) -->
  <rect x="20" y="50" width="1360" height="540" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Nombres de carril -->
  <rect x="20" y="50" width="60" height="170" fill="#f4e9d8" stroke="#333" stroke-width="1.5"/>
  <text x="55" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" transform="rotate(-90 55 135)">Cliente</text>

  <rect x="20" y="220" width="60" height="220" fill="#e3edf7" stroke="#333" stroke-width="1.5"/>
  <text x="55" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" transform="rotate(-90 55 330)">Sistema</text>

  <rect x="20" y="440" width="60" height="150" fill="#e6f4ea" stroke="#333" stroke-width="1.5"/>
  <text x="55" y="515" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" transform="rotate(-90 55 515)">Pasarela de pago</text>

  <!-- Líneas divisorias de carril -->
  <line x1="80" y1="220" x2="1380" y2="220" stroke="#999" stroke-width="1"/>
  <line x1="80" y1="440" x2="1380" y2="440" stroke="#999" stroke-width="1"/>

  <!-- ===== Carril Cliente ===== -->
  <!-- Evento inicio -->
  <circle cx="130" cy="135" r="20" fill="#fff" stroke="#2e7d32" stroke-width="3"/>
  <text x="130" y="170" text-anchor="middle" font-size="11">Inicio</text>

  <!-- Actividad: navega catálogo -->
  <rect x="190" y="105" width="150" height="60" rx="10" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
  <text x="265" y="130" text-anchor="middle" font-size="12">Navega el</text>
  <text x="265" y="146" text-anchor="middle" font-size="12">catálogo</text>

  <!-- Actividad: agrega al carrito -->
  <rect x="380" y="105" width="150" height="60" rx="10" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
  <text x="455" y="130" text-anchor="middle" font-size="12">Agrega producto</text>
  <text x="455" y="146" text-anchor="middle" font-size="12">al carrito</text>

  <!-- Actividad: inicia checkout -->
  <rect x="570" y="105" width="150" height="60" rx="10" fill="#fff8e1" stroke="#333" stroke-width="1.5"/>
  <text x="645" y="130" text-anchor="middle" font-size="12">Inicia</text>
  <text x="645" y="146" text-anchor="middle" font-size="12">checkout</text>

  <!-- Evento fin: pedido confirmado -->
  <circle cx="1300" cy="135" r="22" fill="#fff" stroke="#c62828" stroke-width="4"/>
  <text x="1300" y="172" text-anchor="middle" font-size="11">Fin: confirmado</text>

  <!-- ===== Carril Sistema ===== -->
  <!-- Actividad: redirige a Stripe -->
  <rect x="570" y="260" width="150" height="60" rx="10" fill="#e3edf7" stroke="#333" stroke-width="1.5"/>
  <text x="645" y="285" text-anchor="middle" font-size="12">Redirige a</text>
  <text x="645" y="301" text-anchor="middle" font-size="12">pasarela Stripe</text>

  <!-- Compuerta de decisión -->
  <polygon points="800,290 840,255 880,290 840,325" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="840" y="240" text-anchor="middle" font-size="12" font-weight="bold">¿Pago</text>
  <text x="840" y="345" text-anchor="middle" font-size="12" font-weight="bold">aprobado?</text>

  <!-- Rama SÍ: guarda pedido y envía correo -->
  <rect x="920" y="260" width="150" height="60" rx="10" fill="#e6f4ea" stroke="#333" stroke-width="1.5"/>
  <text x="995" y="285" text-anchor="middle" font-size="12">Guarda pedido y</text>
  <text x="995" y="301" text-anchor="middle" font-size="12">envía correo</text>
  <text x="900" y="270" font-size="12" fill="#2e7d32" font-weight="bold">Sí</text>

  <!-- Rama NO: muestra error -->
  <rect x="920" y="360" width="150" height="60" rx="10" fill="#fdecea" stroke="#333" stroke-width="1.5"/>
  <text x="995" y="385" text-anchor="middle" font-size="12">Muestra error</text>
  <text x="995" y="401" text-anchor="middle" font-size="12">de pago</text>
  <text x="900" y="380" font-size="12" fill="#c62828" font-weight="bold">No</text>

  <!-- Evento fin: pago rechazado -->
  <circle cx="1300" cy="390" r="22" fill="#fff" stroke="#c62828" stroke-width="4"/>
  <text x="1300" y="427" text-anchor="middle" font-size="11">Fin: rechazado</text>

  <!-- ===== Carril Pasarela de pago ===== -->
  <rect x="760" y="480" width="150" height="60" rx="10" fill="#e6f4ea" stroke="#333" stroke-width="1.5"/>
  <text x="835" y="505" text-anchor="middle" font-size="12">Procesa el pago</text>
  <text x="835" y="521" text-anchor="middle" font-size="12">(Stripe test mode)</text>

  <!-- ===== Flechas de secuencia ===== -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <line x1="150" y1="135" x2="190" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="135" x2="380" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="135" x2="570" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="165" x2="645" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="290" x2="800" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Compuerta -> pasarela (para procesar el pago) -->
  <path d="M840,325 L840,410 L835,480" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850" y="410" font-size="11" fill="#555">envía a procesar</text>

  <!-- Pasarela -> compuerta (resultado del pago) -->
  <path d="M910,505 L1000,505 L1000,420 L995,420" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1005" y="460" font-size="11" fill="#555">resultado</text>

  <!-- Compuerta -> Sí -->
  <line x1="880" y1="290" x2="920" y2="290" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Compuerta -> No -->
  <path d="M840,325 L840,390 L920,390" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sí -> evento fin confirmado -->
  <path d="M1070,280 L1150,280 L1150,135 L1278,135" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- No -> evento fin rechazado -->
  <line x1="1070" y1="390" x2="1278" y2="390" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Leyenda -->
  <text x="30" y="610" font-size="11" fill="#666">Notación BPMN 2.0 · Cibertec — Desarrollo de Entornos Web · Ticket #1</text>
</svg>
